name: Deploy to Salesforce

on:
  push:
    branches:
      - dev
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Set Auth URL based on branch
        run: |
          if [ "${{ github.ref_name }}" == "dev" ]; then
            echo "${{ secrets.SFDX_AUTH_URL }}" > ./authfile.txt
          elif [ "${{ github.ref_name }}" == "uat" ]; then
            echo "${{ secrets.SFDX_AUTH_URL_UAT }}" > ./authfile.txt
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "${{ secrets.SFDX_AUTH_URL_PROD }}" > ./authfile.txt
          fi
          sf org login sfdx-url --sfdx-url-file ./authfile.txt --alias targetorg

      - name: Deploy
        run: sf project deploy start --target-org targetorg --source-dir force-app